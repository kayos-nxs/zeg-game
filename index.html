<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Zeg Game</title>
</head>

<style>
body {
    background-color: rgb(7, 7, 7)
}
#rectangle, #rectangle_title {
    width: 600px;
    height: 100px;
    background: silver;
    margin: 0; 
    display: flex;
    justify-content: center;
    align-items: center;
}

canvas {
    display: block;
}

.mainGame {
    width: 600px;
    border: 1px solid black;
    display: flex;
    flex-direction: column;
}

.container {
    display: flex;
    justify-content: center; 
    align-items: center;     
    height: 90vh;          
    width: 96vw;         
} 

/* #reset {
    visibility:hidden;
} */
</style>

<body>
    <div class="container"> <!-- Main container -->
        <div class="mainGame"> <!-- Game container -->

            <h1 id="rectangle_title">Zeg Game</h1> 
            
            <canvas id="myCanvas" width="600" height="550"></canvas>
            
            <div id="rectangle">
                <button id="play" onclick="startGame();" style="width: 200px; height: 50px;">Graj</button>    
                <button id="reset" onclick="resetGame();" style="width: 200px; height: 50px;">Zresetuj</button>  
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="scripts/images.js"></script>
    <script src="scripts/objects.js"></script>
    <script src="scripts/gameStates.js"></script>
    <script src="scripts/utils.js"></script>
    <script src="scripts/main.js"></script>
    
</body>
</html>
